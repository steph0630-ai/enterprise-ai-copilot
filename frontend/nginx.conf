# 前端 nginx 配置（Day 17）
# 两个职责：托管 Vue 静态文件 + 把 /api 请求反代给后端容器

server {
    listen 80;
    server_name _;

    # 上传体积上限（Day 18 踩坑）：nginx 默认只有 1MB，>1MB 的文件直接被拒（413），
    # 请求根本到不了后端。提到 200MB，和后端 settings.MAX_DOC_SIZE 对齐。
    # 大文件到了后端也是后台异步入库（上传秒回），所以不用担心请求挂着。
    client_max_body_size 200m;

    root /usr/share/nginx/html;
    index index.html;

    # 前端静态文件；try_files 让 SPA 路由回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到后端容器（compose 里后端服务名叫 backend）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # 关键：SSE 流式必须关缓冲！
        # 开着缓冲，nginx 会攒够一块才转发，打字机效果变成"憋半天突然全出"
        proxy_buffering off;
        # 流式回答可能几十秒，超时给足
        proxy_read_timeout 3600s;
    }
}
